name: Avani 2.0 APK Builder

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Avani 2.0 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:

      # 1. Checkout Repository
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # 4. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Verify Environment
      - name: Verify Environment
        run: |
          node --version
          bun --version
          java -version

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      # 7. Verify Android SDK
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb version

      # 8. Verify Project Files
      - name: Verify Project
        run: |
          test -f package.json
          test -f bun.lock
          test -f vite.config.ts
          test -f index.html

      # 9. Install Dependencies
      - name: Install Dependencies
        run: bun install

      # 10. Install Capacitor
      - name: Install Capacitor
        run: |
          bun add @capacitor/core@7
          bun add @capacitor/android@7
          bun add -d @capacitor/cli@7

      # 11. Configure Capacitor
      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mgshankar.avani",
            "appName": "Avani 2.0",
            "webDir": "dist",
            "backgroundColor": "#080B14"
          }
          EOF

      # 12. Build Web Application
      - name: Build Avani Web Application
        run: bun run build

      # 13. Verify Web Build
      - name: Verify Web Build
        run: |
          test -s dist/index.html
          echo "Web build successful"

      # 14. Generate Android Project
      - name: Generate Android Project
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      # 15. Sync Android Project
      - name: Sync Android
        run: bunx cap sync android

      # 16. Verify Android Project
      - name: Verify Android
        run: |
          test -f android/gradlew
          test -d android/app/src/main
          echo "Android project verified"

      # 17. Build Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 18. Verify APK
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      # 19. Upload APK
      - name: Upload Avani 2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Avani-2.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
