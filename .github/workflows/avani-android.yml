name: Avani 2.0 APK Production Builder

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Avani 2.0 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:

      # 1. Checkout Repository
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # 4. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 5. Verify Environment
      - name: Verify Environment
        run: |
          node --version
          bun --version
          java -version

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      # 7. Verify Android SDK
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          adb version

      # 8. Verify Project
      - name: Verify Project
        run: |
          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f assets/avani-logo.png

      # 9. Install Dependencies
      - name: Install Dependencies
        run: bun install

      # 10. Install Capacitor
      - name: Install Capacitor
        run: |
          bun add @capacitor/core@7
          bun add @capacitor/android@7
          bun add -d @capacitor/cli@7

      # 11. Configure Capacitor
      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mgshankar.avani",
            "appName": "Avani 2.0",
            "webDir": "dist",
            "backgroundColor": "#FFFFFF"
          }
          EOF

      # 12. Build Web Application
      - name: Build Avani Web Application
        run: bun run build

      # 13. Verify Web Build
      - name: Verify Web Build
        run: |
          test -s dist/index.html
          echo "Web build successful"

      # 14. Generate Android Project
      - name: Generate Android Project
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      # 15. Sync Android
      - name: Sync Android
        run: bunx cap sync android

      # 16. Generate Avani App Icons
      - name: Generate Avani App Icons
        run: |
          python3 -m venv .icon-env
          .icon-env/bin/pip install Pillow

          .icon-env/bin/python <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open(
              "assets/avani-logo.png"
          ).convert("RGBA")

          res = Path("android/app/src/main/res")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = source.copy()
              icon.thumbnail(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              canvas = Image.new(
                  "RGBA",
                  (size, size),
                  (255, 255, 255, 255)
              )

              x = (size - icon.width) // 2
              y = (size - icon.height) // 2

              canvas.alpha_composite(icon, (x, y))

              canvas.save(folder / "ic_launcher.png")
              canvas.save(folder / "ic_launcher_round.png")

          # Adaptive foreground
          folder = res / "drawable-nodpi"
          folder.mkdir(parents=True, exist_ok=True)

          foreground = Image.new(
              "RGBA",
              (432, 432),
              (0, 0, 0, 0)
          )

          logo = source.copy()
          logo.thumbnail(
              (270, 270),
              Image.Resampling.LANCZOS
          )

          x = (432 - logo.width) // 2
          y = (432 - logo.height) // 2

          foreground.alpha_composite(logo, (x, y))

          foreground.save(
              folder / "avani_icon_foreground.png"
          )

          # Adaptive icon XML
          folder = res / "mipmap-anydpi-v26"
          folder.mkdir(parents=True, exist_ok=True)

          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/avani_icon_background"/>
              <foreground android:drawable="@drawable/avani_icon_foreground"/>
          </adaptive-icon>
          '''

          (folder / "ic_launcher.xml").write_text(xml)
          (folder / "ic_launcher_round.xml").write_text(xml)

          # Background color
          folder = res / "values"
          folder.mkdir(parents=True, exist_ok=True)

          colors = '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="avani_icon_background">#FFFFFF</color>
          </resources>
          '''

          (folder / "avani_icon_colors.xml").write_text(colors)

          print("Avani icons generated successfully!")
          PY

      # 17. Verify Icons
      - name: Verify App Icons
        run: |
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable-nodpi/avani_icon_foreground.png

      # 18. Verify Android
      - name: Verify Android Project
        run: |
          test -f android/gradlew
          test -d android/app/src/main

      # 19. Build Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew

          java -version

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 20. Verify APK
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK CREATED SUCCESSFULLY"

          ls -lh "$APK"

      # 21. Upload APK
      - name: Upload Avani 2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Avani-2.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
