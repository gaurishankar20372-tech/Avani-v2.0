name: Build Avani-v2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bun and Project Dependencies
        run: |
          npm install -g bun
          bun install
          bun run build

      - name: Initialize Capacitor and Add Android Platform
        run: |
          # Capacitor और एंड्रॉइड पैकेज इंस्टॉल करें
          bun add @capacitor/core @capacitor/cli @capacitor/android
          
          # अगर capacitor.config.ts नहीं है, तो इसे ऑटो-क्रिएट करें
          if [ ! -f "capacitor.config.ts" ]; then
            echo "Creating capacitor.config.ts..."
            npx cap init "Avani" "com.avani.app" --web-dir dist --yes
          fi

          # अगर android फोल्डर नहीं है, तो उसे जोड़ें
          if [ ! -d "android" ]; then
            echo "Adding android platform..."
            npx cap add android
          else
            echo "Android folder already exists."
          fi

          # सिंक करें
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Clean and Build Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avani-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
