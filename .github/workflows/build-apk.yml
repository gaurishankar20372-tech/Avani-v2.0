name: Build Avani-v2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Detect Package Manager & Install Dependencies
        run: |
          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            echo "Bun detected..."
            npm install -g bun
            bun install
            bun run build
          elif [ -f "package-lock.json" ]; then
            echo "npm lockfile detected..."
            npm ci
            npm run build
          else
            echo "Using default npm install..."
            npm install
            npm run build
          fi

      - name: Install Capacitor Core & CLI
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

      - name: Setup Android Platform & Sync
        run: |
          # अगर एंड्रॉइड फोल्डर नहीं है, तो यह ऑटोमैटिक इनिशियलाइज कर देगा
          if [ ! -d "android" ]; then
            echo "Android folder missing. Initializing Capacitor Android..."
            npx cap init "Avani" "com.avani.app" --web-dir dist --yes
            npx cap add android
          else
            echo "Android folder found."
          fi
          
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Clean and Build Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avani-v2.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
