name: Build Android APK Safely

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies and Build Web App
        run: |
          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            echo "Using Bun package manager..."
            npm install -g bun
            bun install
            bun run build
          else
            echo "Using npm package manager..."
            npm install
            npm run build
          fi

      - name: Install Capacitor CLI & Core
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Sync Capacitor Android Platform
        run: |
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Clean and Build Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avani-v2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
