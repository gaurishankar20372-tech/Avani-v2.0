name: Avani 2.0 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Avani 2.0
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor 7
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@7 \
            @capacitor/android@7 \
            @capacitor/cli@7

      - name: Build Avani Web App
        run: npm run build

      - name: Verify Web Build
        run: |
          test -f dist/index.html
          echo "Avani Web Build Successful"

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mgshankar.avani",
            "appName": "Avani 2.0",
            "webDir": "dist",
            "backgroundColor": "#080B14"
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "AVANI APK CREATED SUCCESSFULLY"

      - name: Upload Avani APK
        uses: actions/upload-artifact@v4
        with:
          name: AVANI-2.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
